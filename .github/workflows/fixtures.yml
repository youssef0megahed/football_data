name: Football Data Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "30 * * * *"


jobs:

  football-pipeline:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # =====================================================
      # Football Data
      # =====================================================

      - name: Run Football Data Pipeline
        run: python src/fixtures.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}


      # =====================================================
      # News Engine
      # =====================================================

      - name: Run News Engine
        run: python src/news.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


      - name: Run News Collector
        run: python src/news_collector.py
        env:
          THE_NEWS_API_KEY: ${{ secrets.THE_NEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
