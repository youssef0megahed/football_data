name: "🛠️ [يدوي] تعبئة تاريخية (Backfill)"

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "تاريخ بداية الموسم (YYYY-MM-DD)"
        required: false
        default: "2026-08-01"

jobs:
  backfill:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: تعبئة تاريخية للمباريات
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m admin.backfill_fixtures "${{ github.event.inputs.start_date || '2026-08-01' }}"
