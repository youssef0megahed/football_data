name: إعادة مزامنة ماتش واحد (تشخيص)

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "رقم الماتش الداخلي (id في جدول matches)"
        required: true

jobs:
  resync-one:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: إعادة مزامنة ماتش واحد
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python sync_match_details.py "${{ github.event.inputs.match_id }}"
